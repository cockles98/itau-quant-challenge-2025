# HRP-only configuration derived from base.yaml with factor/regime overlays disabled
# Base configuration for Atlas

portfolio:
  method: hrp_only
  hrp_only_regime_value: 0.5

data:
  source: local_csv

paths:
  data: ./data
  reports: ./reports
  artifacts: ./artifacts

seeds: 42

dates:
  start: 2019-01-04
  end: 2022-12-02

tda_ph:
  enabled: false
  window: 30
  homology_dim: 1
  norm: "l2"
  smooth_span: 10
  zscore_lookback: 250
  alert_sigma: 0.75
  riskoff_sigma: 2.0

mapper:
  enabled: false
  lens: "pca_umap"
  n_cubes: 6
  overlap: 0.5
  eps_quantile: 0.2
  min_cluster_size: 12
  epsilon_adaptive: true

factors:
  alphas: [momentum, quality, carry]
  regime_gain: 1
  alpha: 0.5
  beta: 0.2
  gamma: 0.05
  softmax_T: 1.0

windows:
  vol_window: 60
  atr_len: 60

costs:
  fee_bps: 5.0
  k: 0.1
  max_bps: 50.0

participation_cap: 0.025
turnover_cap: 1.0
vol_target: 0.10

universe:
  top_n: 20
  adv_min: 500000.0
  price_min: 5.0
  age_min: 20
  hysteresis_rebalances: 4
  calendar: BME

risk:
  mdd_lookback: 60
  mdd_thres: -0.15
  vol_mult: 1.8
  cooldown_days: 21
  reentry_hysteresis: 0.05
  regime_target_vol:
    scale_low: 0.9
    scale_high: 1.2
  regime_gross:
    low: 1.0
    high: 1.0
  participation_cap_regime:
    low: 0.025
    high: 0.032
  max_cluster_regime:
    low: 0.075
    high: 0.09

validation:
  # Lightweight grid to keep compatibility with tuning scripts
  param_grid:
    factor_alpha: [0.5]
    factor_beta: [0.2]
    factor_gamma: [0.1]
    factor_delta: [0.15]

  robustness_grid:
    n_cubes: [2, 4, 6, 8]
    overlap: [0.25, 0.5, 0.75]

  stress_multipliers: [0.5, 1.0, 1.5]
  participation_caps: [0.01, 0.015, 0.02, 0.025, 0.03, 0.035, 0.04, 0.045, 0.05]
  embargo_days: 5
  n_splits: 3
