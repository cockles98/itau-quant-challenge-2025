# Base configuration for Atlas with elastic-net meta-blend

portfolio:
  method: hrp

data:
  source: local_csv

paths:
  data: ./data
  reports: ./reports
  artifacts: ./artifacts

seeds: 42

dates:
  start: 2019-01-04
  end: 2022-12-02

tda_ph:
  enabled: true
  window: 30
  homology_dim: 1
  norm: "l2"
  smooth_span: 10
  zscore_lookback: 250
  alert_sigma: 0.58
  riskoff_sigma: 1.8

mapper:
  enabled: true
  lens: "pca_umap"
  n_cubes: 8
  overlap: 0.6
  eps_quantile: 0.15
  min_cluster_size: 12
  epsilon_adaptive: true

factors:
  alphas: [momentum, quality, carry]
  regime_gain: 1
  alpha: 0.5
  beta: 0.2
  gamma: 0.05
  delta: 0.15
  use_peripherality: true
  softmax_T: 1.0
  meta_blend:
    enabled: true
    model_type: elasticnet
    horizon: 21
    standardize: true
    use_regime_feature: true
    use_interactions: true
    alpha_grid: [0.02, 0.05, 0.1]
    l1_ratio_grid: [0.2, 0.5, 0.8]
    cv_n_splits: 4
    cv_embargo_days: 5
    min_train_dates: 252
    rolling_window: 504
    save_artifacts: true
    cv_metric: ic

windows:
  vol_window: 60
  atr_len: 60

covariance:
  ewma_lambda: 0.94
  shrinkage: diagonal
  shrinkage_strength: 0.2

costs:
  fee_bps: 5.0
  k: 0.1
  max_bps: 50.0

participation_cap: 0.025
turnover_cap: 1.0
vol_target: 0.10

universe:
  top_n: 20
  adv_min: 500000.0
  price_min: 5.0
  age_min: 20
  hysteresis_rebalances: 4
  calendar: BME

risk:
  mdd_lookback: 60
  mdd_thres: -0.15
  vol_mult: 1.8
  cooldown_days: 21
  reentry_hysteresis: 0.05
  regime_target_vol:
    scale_low: 0.9
    scale_high: 1.2
  regime_gross:
    low: 1.0
    high: 1.0
  participation_cap_regime:
    low: 0.025
    high: 0.032
  max_cluster_regime:
    low: 0.075
    high: 0.09

validation:
  param_grid:
    factor_alpha: [0.5, 0.6]
    factor_beta: [0.2, 0.3]
    factor_gamma: [0.05, 0.1]
    factor_delta: [0.1, 0.2]

  robustness_grid:
    n_cubes: [4, 6, 8, 10, 12]
    overlap: [0.25, 0.5, 0.75, 1.0]

  stress_multipliers: [0.5, 1.0, 1.5]
  participation_caps: [0.01, 0.015, 0.02, 0.025, 0.03, 0.035, 0.04, 0.045, 0.05]
  embargo_days: 5
  n_splits: 3
