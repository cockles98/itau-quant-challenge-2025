# Base configuration placeholder for t_hrp_v3
# Extend this file with environment-specific overrides.

portfolio:
  method: hrp

data:
  source: local_csv

paths:
  data: ./data
  reports: ./reports
  artifacts: ./artifacts

seeds: 42

dates:
  start: 2019-01-04
  end: 2022-12-02

tda:
  delay: 1
  dim: 3
  n_cubes: 8
  overlap: 0.5
  epsilon: 0.5
  min_samples: 3
  window: 252

factors:
  alphas:
    - momentum
    - quality
    - carry

windows:
  vol_window: 60
  atr_len: 14

costs:
  fee_bps: 5.0
  k: 0.1
  max_bps: 50.0

participation_cap: 0.10
turnover_cap: 0.25
vol_target: 0.10

universe:
  top_n: 20
  adv_min: 500000.0
  price_min: 5.0
  age_min: 20
  hysteresis_rebalances: 2
  calendar: BME

validation:
  param_grid:
    delay: [1, 2]
    dim: [3]
    n_cubes: [6, 8]
    overlap: [0.3, 0.5]
    alpha: [0.5, 0.6]
    beta: [0.3]
    gamma: [0.1]
  robustness_grid:
    epsilon: [0.10, 0.20, 0.30, 0.40]
    n_cubes: [4, 8, 12, 16]
  stress_multipliers: [0.5, 1.0, 1.5]
  participation_caps: [0.01, 0.02, 0.05, 0.10]
  embargo_days: 5
  n_splits: 3
