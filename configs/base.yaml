# Base configuration for T-HRP v3

portfolio:
  method: hrp

data:
  source: local_csv

paths:
  data: ./data
  reports: ./reports
  artifacts: ./artifacts

seeds: 42

dates:
  start: 2019-01-04
  end: 2022-12-02

tda:
  delay: 1 
  dim: 200
  n_cubes: 6
  overlap: 0.5
  epsilon: null
  min_samples: 2
  window: 252

factors:
  alphas: [momentum, quality, carry]
  softmax_T: 2
  regime_gain: 2.0
  alpha: 0.5
  beta: 0.2
  gamma: 0.05

windows:
  vol_window: 60
  atr_len: 60
####
costs:
  fee_bps: 5.0
  k: 0.1
  max_bps: 50.0
####
participation_cap: 0.025
turnover_cap: 1.0
vol_target: 0.10

universe:
  top_n: 20
  adv_min: 500000.0 ####
  price_min: 5.0
  age_min: 20
  hysteresis_rebalances: 4
  calendar: BME

# risk:
#  enable_kill: false
#  mdd_thres: -0.30      # de -0.20 para -0.30
#  vol_mult:  2.5        # de 1.8 para 2.5

validation:
  # grid amplo para sanity/ablação (pode ser 3D+)
  param_grid:
    delay: [1, 2]
    dim: [3]
    # Focar em cubos mais cheios e maior sobreposição
    n_cubes: [3, 4, 6]
    overlap: [0.8, 1.0]
    alpha: [0.5, 0.6]
    beta: [0.3]
    gamma: [0.1]

  # heatmaps 2D — mantenha exatamente duas chaves aqui
  robustness_grid:
    # Com epsilon adaptativo ligado (epsilon: null), varrer um eixo de "ganho do regime"
    # Requer o patch do factors.py (REGIME_GAIN/REGIME_MODE) e robustness.py compatível
    softmax_T: [0.95, 1.00, 1.05, 1.10, 1.15]
    regime_gain: [1.5, 1.75, 2.0, 2.25]

  stress_multipliers: [0.5, 1.0, 1.5]
  participation_caps: [0.008, 0.009, 0.01, 0.011, 0.012, 0.013, 0.014, 0.015, 0.02, 0.022, 0.025, 0.03, 0.035, 0.04, 0.05]
  embargo_days: 5
  n_splits: 3

