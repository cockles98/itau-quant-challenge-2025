# Base configuration for T-HRP v3

portfolio:
  method: hrp
  expected_returns:
    enabled: true
    max_tilt: 0.03
    min_signal_z: 0.00
    regime_gate: 0.0
    risk_aversion: 2.5
    long_only: true

data:
  source: local_csv

paths:
  data: ./data
  reports: ./reports
  artifacts: ./artifacts

seeds: 42

dates:
  start: 2017-09-04
  end: 2025-10-06

tda:
  delay: 1 
  dim: 2 
  n_cubes: 2 #
  overlap: 0.2 #
  epsilon: null #
  min_samples: 4
  window: 168 # tuned window used in best run
  eps_quantile: 0.15
  smooth_span: 10
  n_jobs: -1

tda_ph:
  enabled: true
  window: 50
  homology_dim: 1         # H1
  norm: "l2"              # l1|l2
  smooth_span: 10         # EMA na saída do índice
  zscore_lookback: 250    # para thresholds
  alert_sigma: 1.0
  riskoff_sigma: 2.0

factors:
  alphas: [momentum, quality, carry]
  regime_gain: 1
  alpha: 0.5
  beta: 0.2
  gamma: 0.05
  softmax_T: 1.0        # fallback
  meta_blend:
    n_jobs: -1
    enabled: true
    model_type: elasticnet
    horizon: 21
    standardize: true
    use_regime_feature: true
    use_interactions: true
    alpha_grid: [0.05, 0.1]
    l1_ratio_grid: [0.5]
    cv_n_splits: 3
    cv_embargo_days: 5
    min_train_dates: 252
    rolling_window: 252
    save_artifacts: false
    cv_metric: ic
    n_jobs: -1


windows:
  vol_window: 60
  atr_len: 60

# covariance tuned for the best elastic-net run
#covariance:
#  ewma_lambda: 0.94            # exponential weighting for stability
#  shrinkage: diagonal          # diagonal | identity | constant_correlation | ledoit_wolf
#  shrinkage_strength: 0.2      # only used for non-ledoit targets

costs:
  fee_bps: 5.0
  k: 0.1
  max_bps: 50.0

participation_cap: 0.025
turnover_cap: 1.0
vol_target: 0.10

universe:
  top_n: 20
  adv_min: 500000.0 ####
  price_min: 5.0
  age_min: 20
  hysteresis_rebalances: 4
  calendar: BME

risk:
  mdd_lookback: 60
  mdd_thres: -0.15
  vol_mult: 1.8
  cooldown_days: 21
  reentry_hysteresis: 0.05
  regime_target_vol:
    scale_low: 0.9
    scale_high: 1.2
  regime_gross:
    low: 1.0
    high: 1.0
  participation_cap_regime:
    low: 0.025
    high: 0.032
  max_cluster_regime:
    low: 0.075
    high: 0.09


validation:
  # grid amplo para sanity/ablação (pode ser 3D+)
  param_grid:
    delay: [1]
    dim: [2]
    # Focar em cubos mais cheios e maior sobreposição
    n_cubes: [4, 6]
    overlap: [0.5, 0.75]
    alpha: [0.5]
    beta: [0.2]
    gamma: [0.1]

  # heatmaps 2D — mantenha exatamente duas chaves aqui
  robustness_grid:
    # Com epsilon adaptativo ligado (epsilon: null), varrer um eixo de "ganho do regime"
    # Requer o patch do factors.py (REGIME_GAIN/REGIME_MODE) e robustness.py compatível
    n_cubes: [1,2,3,4]
    overlap: [0.1, 0.2, 0.3]

  stress_multipliers: [0.5, 1.0, 1.5]
  participation_caps: [0.01, 0.015, 0.02, 0.025, 0.03, 0.035, 0.04, 0.045, 0.05]
  embargo_days: 5
  n_splits: 3

