# Base configuration for T-HRP v3

portfolio:
  method: hrp

data:
  source: local_csv

paths:
  data: ./data
  reports: ./reports
  artifacts: ./artifacts

seeds: 42

dates:
  start: 2019-01-04
  end: 2022-12-02

tda:
  delay: 1 
  dim: 2 
  n_cubes: 4 #
  overlap: 0.5 #
  epsilon: null #
  min_samples: 4
  window: 252 #
  eps_quantile: 0.15
  smooth_span: 10

factors:
  alphas: [momentum, quality, carry]
  regime_gain: 1
  alpha: 0.5
  beta: 0.2
  gamma: 0.05
  softmax_T: 1.0        # fallback


windows:
  vol_window: 60
  atr_len: 60

####
costs:
  fee_bps: 5.0
  k: 0.1
  max_bps: 50.0
####

participation_cap: 0.025
turnover_cap: 1.0
vol_target: 0.10

universe:
  top_n: 20
  adv_min: 500000.0 ####
  price_min: 5.0
  age_min: 20
  hysteresis_rebalances: 4
  calendar: BME

risk:
  regime_target_vol:
    scale_low: 0.9
    scale_high: 1.2
  regime_gross:
    low: 1.0
    high: 1.0
  participation_cap_regime:
    low: 0.025
    high: 0.032
  max_cluster_regime:
    low: 0.075
    high: 0.09


validation:
  # grid amplo para sanity/ablação (pode ser 3D+)
  param_grid:
    delay: [1]
    dim: [2]
    # Focar em cubos mais cheios e maior sobreposição
    n_cubes: [4, 6]
    overlap: [0.5, 0.75]
    alpha: [0.5]
    beta: [0.2]
    gamma: [0.1]

  # heatmaps 2D — mantenha exatamente duas chaves aqui
  robustness_grid:
    # Com epsilon adaptativo ligado (epsilon: null), varrer um eixo de "ganho do regime"
    # Requer o patch do factors.py (REGIME_GAIN/REGIME_MODE) e robustness.py compatível
    n_cubes: [1,2,4,6,8,10,12]
    overlap: [0.25, 0.5, 0.75, 1.0]

  stress_multipliers: [0.5, 1.0, 1.5]
  participation_caps: [0.01, 0.015, 0.02, 0.025, 0.03, 0.035, 0.04, 0.045, 0.05]
  embargo_days: 5
  n_splits: 3

